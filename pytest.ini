[pytest]
testpaths = tests
addopts = -q
markers =
    realdata: needs the downloaded How2Sign subset (skipped when absent)
    phoenix: needs the downloaded PHOENIX-2014-T subset (skipped when absent)
    tts: needs piper-tts and the downloaded Vietnamese voice (skipped when absent)
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
